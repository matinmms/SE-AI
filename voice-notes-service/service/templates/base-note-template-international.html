        .d-pt-2{fill:#c98512;font-family:var(--font-primary)}
        .d-div{stroke:var(--color-table-border);stroke-width:1.5}
        @media(max-width:600px){.v5-cards{grid-template-columns:1fr}}
        @media print{.v5-callout,.v5-card,.v5-table,.v5-diagram,.v5-summary,.v5-q,.v5-code{break-inside:avoid}}
    
        /* The whole-class text (note style "transcript"): a plain, quiet reading page. */
        .template-wrapper--transcript .page-content { gap: 12px; }
        .template-wrapper--transcript .section-header {
            display: block;
            margin: 18px 0 0;
            padding: 0;
            background: none;
            border: 0;
            box-shadow: none;
        }
        .template-wrapper--transcript .section-header__number,
        .template-wrapper--transcript .section-header__accent-dot { display: none; }
        .template-wrapper--transcript .section-header__title {
            font-size: 17px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.01em;
        }
        .template-wrapper--transcript .paragraph--transcript {
            margin: 0;
            font-size: 14.5px;
            line-height: 2.05;
            color: #1f2937;
            text-align: justify;
        }
        .template-wrapper--transcript .paragraph__time {
            display: inline-block;
            margin-inline-end: 10px;
            padding: 1px 7px;
            border-radius: 999px;
            background: #f3f4f6;
            color: #6b7280;
            font-size: 10.5px;
            font-weight: 600;
            line-height: 1.8;
            vertical-align: 2px;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    {{CONTENT}}

    <script>
        (function () {
            const PAGE_SELECTOR = '.a4-page';
            const CONTENT_SELECTOR = '.page-content';
            const FOOTER_SELECTOR = '.page-footer';
            const PAGE_NUMBER_SELECTOR = '.page-footer__page-number';
            const MAX_ITERATIONS = 200;
            const MAX_PAGE_COUNT = 400;
            const KEEP_WITH_NEXT_TYPES = new Set(['chapter-header', 'section-header', 'subsection-header']);
            let paginationQueue = Promise.resolve();
            let automaticPaginationScheduled = false;

            function createPageFromTemplate(templatePage) {
                const page = templatePage.cloneNode(false);
                const header = templatePage.querySelector('.page-header')?.cloneNode(true);
                const content = document.createElement('main');
                content.className = 'page-content';
                const footer = templatePage.querySelector(FOOTER_SELECTOR)?.cloneNode(true);

                if (header) page.appendChild(header);
                page.appendChild(content);
                if (footer) page.appendChild(footer);
                return page;
            }

            function getPages() {
                return Array.from(document.querySelectorAll(PAGE_SELECTOR));
            }

            function getContentBlocks(page) {
                const content = page.querySelector(CONTENT_SELECTOR);
                if (!content) return [];
                return Array.from(content.children);
            }

            function consolidateSummaryBoxes() {
                // Work from the visual element so older stored HTML without the
                // modern note-block wrapper is repaired too.
                const summaries = Array.from(document.querySelectorAll('.summary-box'));
                if (!summaries.length) return;

                const containers = summaries.map(
                    (summary) => summary.closest('.note-block') || summary
                );
                const primarySummary = summaries[0];
                const primary = containers[0];
                let primaryList = primarySummary.querySelector('.summary-box__list');
                if (!primaryList) {
                    primaryList = document.createElement('ul');
                    primaryList.className = 'summary-box__list';
                    const primaryContent = primarySummary.querySelector('.summary-box__content');
                    (primaryContent || primarySummary).appendChild(primaryList);
                }
                const seenItems = new Set();
                if (primaryList) {
                    summaries.forEach((summary, summaryIndex) => {
                        const items = Array.from(summary.querySelectorAll('.summary-box__list-item'));
                        items.forEach((item) => {
                            const signature = (item.textContent || '').replace(/\s+/g, ' ').trim();
                            if (!signature || seenItems.has(signature)) {
                                item.remove();
                                return;
                            }
                            seenItems.add(signature);
                            if (item.parentElement !== primaryList) primaryList.appendChild(item);
                        });

                        const contentParagraphs = Array.from(
                            summary.querySelectorAll('.summary-box__content > .paragraph, .summary-box__content > p')
                        );
                        contentParagraphs.forEach((content) => {
                            const signature = (content?.textContent || '').replace(/\s+/g, ' ').trim();
                            if (signature && !seenItems.has(signature)) {
                                const item = document.createElement('li');
                                item.className = 'summary-box__list-item';
                                item.innerHTML = content.innerHTML;
                                primaryList.appendChild(item);
                                seenItems.add(signature);
                            }
                            content.remove();
                        });

                        if (summaryIndex > 0 && containers[summaryIndex] === primary) {
                            summary.remove();
                        }
                    });
                }

                containers.slice(1).forEach((container) => {
                    if (container !== primary && container.isConnected) container.remove();
                });
                const finalContent = getPages().at(-1)?.querySelector(CONTENT_SELECTOR);
                if (finalContent && primary.parentElement !== finalContent) {
                    finalContent.appendChild(primary);
                } else if (finalContent && primary !== finalContent.lastElementChild) {
                    finalContent.appendChild(primary);
                }
            }

            function isKeepWithNextBlock(block) {
                return KEEP_WITH_NEXT_TYPES.has(block?.dataset?.blockType || '');
            }

            function isOverflowing(page) {
                return page.scrollHeight > page.clientHeight + 2;
            }

            function fitOversizedBlock(page, block) {
                for (const zoom of [0.92, 0.84, 0.76, 0.68, 0.6]) {
                    block.style.zoom = String(zoom);
                    if (!isOverflowing(page)) {
                        block.dataset.paginationScale = String(zoom);
                        return true;
                    }
                }
                block.style.zoom = '';
                return false;
            }

            function canMoveBlockToPage(page, block) {
                const content = page.querySelector(CONTENT_SELECTOR);
                if (!content) return false;
                const previousParent = block.parentNode;
                const nextSibling = block.nextSibling;
                content.appendChild(block);
                const fits = !isOverflowing(page);
                if (!fits) {
                    content.removeChild(block);
                    if (previousParent) {
                        previousParent.insertBefore(block, nextSibling);
                    }
                }
                return fits;
            }

            function renumberPages() {
                getPages().forEach((page, index) => {
                    const pageNumber = page.querySelector(PAGE_NUMBER_SELECTOR);
                    if (pageNumber) {
                        const label = pageNumber.dataset.pageLabel || 'Page';
                        const value = String(index + 1);
                        pageNumber.dataset.pageIndex = value;
                        pageNumber.setAttribute('aria-label', `${label} ${value}`);
                        const labelNode = pageNumber.querySelector('.page-footer__page-label');
                        const indexNode = pageNumber.querySelector('.page-footer__page-index');
                        if (labelNode && indexNode) {
                            labelNode.textContent = label;
                            indexNode.textContent = value;
                        } else {
                            pageNumber.textContent = `${label} ${value}`;
                        }
                    }
                });
            }

            function removeEmptyPages() {
                getPages().forEach((page, index, pages) => {
                    if (pages.length <= 1) return;
                    if (getContentBlocks(page).length === 0) {
                        page.remove();
                    }
                });
            }

            function rebalancePages() {
                const pages = getPages();
                if (!pages.length) return;
                const templatePage = pages[0];

                for (let iteration = 0; iteration < MAX_ITERATIONS; iteration += 1) {
                    let changed = false;
                    let currentPages = getPages();

                    for (let pageIndex = 0; pageIndex < currentPages.length; pageIndex += 1) {
                        const page = currentPages[pageIndex];
                        const content = page.querySelector(CONTENT_SELECTOR);
                        if (!content) continue;

                        while (isOverflowing(page)) {
                            const blocks = getContentBlocks(page);
                            if (!blocks.length) break;
                            const block = blocks[blocks.length - 1];
                            if (blocks.length === 1) {
                                if (fitOversizedBlock(page, block)) break;
                                throw new Error(`A note block is too tall for one PDF page: ${block.dataset.blockType || 'unknown'}`);
                            }
                            let nextPage = currentPages[pageIndex + 1];
                            if (!nextPage) {
                                if (currentPages.length >= MAX_PAGE_COUNT) {
                                    throw new Error('PDF pagination exceeded the safe page limit.');
                                }
                                nextPage = createPageFromTemplate(templatePage);
                                page.insertAdjacentElement('afterend', nextPage);
                                currentPages = getPages();
                            }
                            const nextContent = nextPage.querySelector(CONTENT_SELECTOR);
                            if (!nextContent) break;
                            nextContent.insertBefore(block, nextContent.firstChild);
                            changed = true;
                        }
                    }

                    currentPages = getPages();
                    for (let pageIndex = 0; pageIndex < currentPages.length - 1; pageIndex += 1) {
                        const page = currentPages[pageIndex];
                        const nextPage = currentPages[pageIndex + 1];
                        const nextBlocks = getContentBlocks(nextPage);
                        if (!nextBlocks.length) continue;

                        const candidate = nextBlocks[0];
                        if (isKeepWithNextBlock(candidate)) {
                            if (nextBlocks.length < 2) continue;
                            const pairedBlock = nextBlocks[1];
                            const content = page.querySelector(CONTENT_SELECTOR);
                            if (!content) continue;
                            const sourceContent = nextPage.querySelector(CONTENT_SELECTOR);
                            if (!sourceContent) continue;
                            const pairedNextSibling = pairedBlock.nextSibling;
                            content.appendChild(candidate);
                            content.appendChild(pairedBlock);
                            if (isOverflowing(page)) {
                                content.removeChild(pairedBlock);
                                content.removeChild(candidate);
                                sourceContent.insertBefore(pairedBlock, pairedNextSibling);
                                sourceContent.insertBefore(candidate, pairedBlock);
                                continue;
                            }
                            changed = true;
                            continue;
                        }

                        if (canMoveBlockToPage(page, candidate)) {
                            changed = true;
                        }
                    }

                    removeEmptyPages();
                    if (!changed) break;
                }

                renumberPages();
            }

            async function runPagination() {
                document.documentElement.dataset.paginationReady = 'false';
                window.__tesanotePaginationReady = false;

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                const imagePromises = Array.from(document.images || []).map((image) => {
                    if (image.complete) {
                        return Promise.resolve();
                    }
                    if (typeof image.decode === 'function') {
                        return image.decode().catch(() => {});
                    }
                    return new Promise((resolve) => {
                        image.addEventListener('load', resolve, { once: true });
                        image.addEventListener('error', resolve, { once: true });
                    });
                });
                await Promise.all(imagePromises);

                await new Promise((resolve) => window.requestAnimationFrame(resolve));
                await new Promise((resolve) => window.requestAnimationFrame(resolve));
                consolidateSummaryBoxes();
                rebalancePages();
                // A final pass after layout settles covers every page created from the
                // page-one template during overflow handling.
                await new Promise((resolve) => window.requestAnimationFrame(resolve));
                renumberPages();
                document.documentElement.dataset.paginationReady = 'true';
                window.__tesanotePaginationReady = true;
            }

            function preparePagination(options = {}) {
                const force = options && options.force === true;
                if (!force && automaticPaginationScheduled) {
                    return paginationQueue;
                }
                if (!force) {
                    automaticPaginationScheduled = true;
                }

                // DOMContentLoaded, load, and Playwright may request pagination at
                // nearly the same time. Serializing them prevents a late clone of the
                // first footer from appearing after another run has already numbered.
                paginationQueue = paginationQueue
                    .catch(() => {})
                    .then(runPagination);
                return paginationQueue;
            }

            window.__tesanotePreparePagination = preparePagination;
            window.__tesanoteRenumberPages = renumberPages;
            window.__tesanoteConsolidateSummaryBoxes = consolidateSummaryBoxes;

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', preparePagination, { once: true });
            } else {
                preparePagination();
            }

            window.addEventListener('load', preparePagination, { once: true });
        })();
    </script>
    <script>
        /* Photos keep fixed pixel frames (crop state). On a screen narrower than the
           frame the frame used to be clipped while the photo stayed full size, so
           only a corner showed. Scale the whole frame down to fit instead. The zoom
           is display-only: the editor strips it before saving. */
        (function () {
            function fitNoteImages() {
                document.querySelectorAll('.note-image-figure').forEach(function (figure) {
                    var frameWidth = parseFloat(figure.style.width);
                    if (!(frameWidth > 0)) return;
                    var block = figure.closest('.note-image-block') || figure.parentElement;
                    var available = block ? block.clientWidth : 0;
                    if (available > 0 && frameWidth > available) {
                        figure.style.zoom = String(available / frameWidth);
                    } else if (figure.style.zoom) {
                        figure.style.removeProperty('zoom');
                    }
                });
            }
            window.__tesanoteFitNoteImages = fitNoteImages;
            window.addEventListener('load', fitNoteImages);
            window.addEventListener('resize', fitNoteImages);
            document.addEventListener('DOMContentLoaded', fitNoteImages);
        })();
    </script>
</body>
